services:
  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "8000:8000"
    environment:
      APP_ENV: DEV
      APP_VERSION: local
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
